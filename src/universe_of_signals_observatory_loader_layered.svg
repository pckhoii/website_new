      <path d="M836 452L822 485M836 452L850 485M826 466H846" class="thin gold"/>
    </g>
    <g id="telescope-tube" transform="rotate(-42 837 428)">
      <rect x="810" y="417" width="73" height="18" rx="3" fill="#0b1621" stroke="#c6984e" stroke-width="1.1"/>
      <rect x="879" y="414" width="14" height="24" fill="#0b1621" stroke="#c6984e"/>
      <line x1="819" y1="420" x2="819" y2="433" class="hair dim"/>
      <circle cx="842" cy="426" r="2.2" fill="#d6a457"/>
    </g>
  </g>

  <g id="layer-antenna" inkscape:groupmode="layer" inkscape:label="08 Antenna">
    <line x1="978" y1="572" x2="978" y2="421" class="thin gold" opacity="0.85"/>
    <line x1="969" y1="570" x2="987" y2="570" class="hair dim"/>
    <circle cx="978" cy="421" r="3.1" fill="#d5a258" filter="url(#softGlow)"/>
    <circle cx="978" cy="421" r="8" fill="none" stroke="#9c7440" stroke-width="0.6" opacity="0.33"/>
  </g>

  <g id="layer-markers" inkscape:groupmode="layer" inkscape:label="09 Alignment Markers">
