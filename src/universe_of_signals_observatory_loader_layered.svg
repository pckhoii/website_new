      <rect x="833" y="213" width="6" height="6" fill="#07111c"/><rect x="833" y="721" width="6" height="6" fill="#07111c"/>
      <rect x="448" y="461" width="6" height="6" fill="#07111c"/><rect x="1217" y="461" width="6" height="6" fill="#07111c"/>
    </g>
    <g class="hair gold dotdash" opacity="0.28"><path d="M836 195V269M836 672V749M425 464H500M1171 464H1247"/></g>
  </g>

  <g id="layer-status" inkscape:groupmode="layer" inkscape:label="10 Status Label">
    <text x="836" y="661" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="6.2" fill="#d7a65b">03 / READING</text>
    <line x1="679" y1="643" x2="679" y2="674" class="hair gold dotdash" opacity="0.42"/>
    <line x1="993" y1="643" x2="993" y2="674" class="hair gold dotdash" opacity="0.42"/>
  </g>
</svg>
