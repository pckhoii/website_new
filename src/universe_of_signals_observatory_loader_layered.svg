      <rect x="744" y="525" width="11" height="8"/><rect x="765" y="527" width="12" height="8"/><rect x="790" y="529" width="12" height="8"/>
      <rect x="871" y="529" width="12" height="8"/><rect x="896" y="527" width="12" height="8"/><rect x="918" y="525" width="11" height="8"/>
    </g>
    <path d="M818 581V550Q818 542 826 542H848Q856 542 856 550V581" fill="#08111b" stroke="#a97f45"/>
    <line x1="837" y1="544" x2="837" y2="581" class="hair dim"/>
    <circle cx="850" cy="562" r="1.7" fill="#c08e4a"/>
    <g id="annex">
      <ellipse cx="661" cy="538" rx="28" ry="7" fill="#0a141f" stroke="#8d6a3d" stroke-width="0.9"/>
      <rect x="633" y="538" width="56" height="35" rx="2" fill="#08131e" stroke="#8d6a3d" stroke-width="0.9"/>
      <ellipse cx="661" cy="573" rx="28" ry="6" fill="#08131e" stroke="#8d6a3d" stroke-width="0.8"/>
      <line x1="641" y1="540" x2="641" y2="571" class="hair dim" opacity="0.5"/>
      <line x1="681" y1="540" x2="681" y2="571" class="hair dim" opacity="0.5"/>
    </g>
  </g>

  <g id="layer-dome" inkscape:groupmode="layer" inkscape:label="06 Observatory Dome">
    <path d="M713 492C721 420 767 372 806 364V493Z" fill="#09131e" stroke="#b1864b" stroke-width="1.2"/>
    <path d="M867 364C906 372 952 420 960 492L867 493Z" fill="#09131e" stroke="#b1864b" stroke-width="1.2"/>
    <rect x="806" y="363" width="17" height="131" fill="#0b1621" stroke="#c09450" stroke-width="1.1"/>
    <rect x="850" y="363" width="17" height="131" fill="#0b1621" stroke="#c09450" stroke-width="1.1"/>
    <path d="M733 487C737 431 762 389 791 372M756 489C758 442 774 401 800 378M940 487C936 431 911 389 882 372M917 489C915 442 899 401 873 378" class="thin dim" opacity="0.62"/>
    <path d="M707 491Q836 501 966 491" class="thin gold"/>
    <path d="M710 500Q836 510 963 500" class="hair dim"/>
  </g>

  <g id="layer-telescope" inkscape:groupmode="layer" inkscape:label="07 Telescope">
