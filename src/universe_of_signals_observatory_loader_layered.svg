<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c89449" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#8c6332" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#07111c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="minorGrid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#314050" stroke-opacity="0.18" stroke-width="0.7"/>
    </pattern>
    <pattern id="majorGrid" width="220" height="220" patternUnits="userSpaceOnUse">
      <rect width="220" height="220" fill="url(#minorGrid)"/>
      <path d="M220 0H0V220" fill="none" stroke="#46576b" stroke-opacity="0.12" stroke-width="0.9"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .gold{stroke:#b8894a}.gold2{stroke:#d4a55d}.dim{stroke:#8e6d3f}
      .thin{fill:none;stroke-width:1.15;vector-effect:non-scaling-stroke}
      .hair{fill:none;stroke-width:.78;vector-effect:non-scaling-stroke}
      .dash{stroke-dasharray:3 6}.dotdash{stroke-dasharray:1.5 5.5}
    ]]></style>
  </defs>

  <g id="layer-background" inkscape:groupmode="layer" inkscape:label="01 Background">
    <rect width="1672" height="941" fill="#07111c"/>
    <rect width="1672" height="941" fill="#02070d" opacity="0.22"/>
  </g>

  <g id="layer-grid" inkscape:groupmode="layer" inkscape:label="02 Grid">
    <rect width="1672" height="941" fill="url(#majorGrid)" opacity="0.58"/>
  </g>

  <g id="layer-glow" inkscape:groupmode="layer" inkscape:label="03 Center Glow">
    <ellipse cx="836" cy="476" rx="350" ry="245" fill="url(#centerGlow)"/>
  </g>

  <g id="layer-orbits" inkscape:groupmode="layer" inkscape:label="04 Orbit System">
    <ellipse cx="836" cy="555" rx="355" ry="59" class="thin dim" opacity="0.55"/>
    <ellipse cx="836" cy="552" rx="213" ry="37" class="hair gold dash" opacity="0.30"/>
    <path d="M581 553C590 423 680 322 809 304C846 299 897 302 945 315" class="thin gold dotdash" opacity="0.78"/>
    <path d="M946 315C964 320 976 324 992 331" class="hair gold dotdash" opacity="0.45"/>
    <circle cx="581" cy="553" r="4.1" fill="#07111c" stroke="#9b7641"/>
    <circle cx="1089" cy="588" r="5.5" fill="#07111c" stroke="#a47e44"/>
    <circle cx="658" cy="608" r="2.1" fill="#cf9d52"/>
    <circle cx="991" cy="610" r="2.1" fill="#cf9d52"/>
    <circle cx="946" cy="315" r="4" fill="#d6a457" filter="url(#softGlow)"/>
