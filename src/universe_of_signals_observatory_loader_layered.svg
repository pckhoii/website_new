    <path d="M713 507H958V519H713Z" fill="#0a141f" stroke="#876536" stroke-width="0.9"/>
    <path d="M724 519Q836 531 947 519V580Q836 592 724 580Z" fill="#09131e" stroke="#aa7f45" stroke-width="1.1"/>
    <path d="M724 532Q836 543 947 532M724 548Q836 558 947 548M724 565Q836 574 947 565" class="hair dim" opacity="0.55"/>
